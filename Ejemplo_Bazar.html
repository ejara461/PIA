<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bazar Escolar - Gestión Integral</title>
    <!-- STREAMING_CHUNK:Loading fonts and Tailwind CSS... -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen text-slate-800 font-['Inter',sans-serif]">
    <div id="app"></div>

    <script>
      /* STREAMING_CHUNK:Initializing application state and mock data... */
      const STORAGE_KEY = "bazar-escolar-tiendas-v13";

      const demoUsers = [
        { id: "u1", username: "ana.comprador", pass: "1234", name: "Ana Estudiante", role: "comprador", balance: 52000, email: "ana@escuela.edu", phone: "3001234567" },
        { id: "u2", username: "carlos.vendedor", pass: "1234", name: "Carlos Vendedor", role: "vendedor", balance: 125000, email: "carlos@escuela.edu", phone: "3119876543" },
        { id: "u3", username: "banco.escolar", pass: "1234", name: "Banco Escolar", role: "banco", balance: 0, email: "banco@escuela.edu", phone: "3221112233" },
        { id: "u4", username: "admin.general", pass: "1234", name: "Admin General", role: "administrador", balance: 0, email: "admin@escuela.edu", phone: "3154445566" }
      ];

      const demoStores = [
        { id: "st1", name: "Dulces San Marcos", vendorId: "u2" }
      ];

      const demoProducts = [
        { id: "p1", code: "PROD-101", name: "Cupcake Vainilla", price: 4500, storeId: "st1" },
        { id: "p2", code: "PROD-102", name: "Limonada Natural", price: 3500, storeId: "st1" }
      ];

      const demoTransactions = [];
      const demoPendingSales = [];

      /* STREAMING_CHUNK:Defining BazarApp class logic... */
      class BazarApp {
        constructor() {
          this.state = this.loadState();
          this.buyerCart = [];
        }

        loadState() {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (!saved) {
            return { currentUser: null, users: demoUsers, stores: demoStores, products: demoProducts, transactions: demoTransactions, pendingSales: demoPendingSales, message: null };
          }
          try {
            const data = JSON.parse(saved);
            if (!data.stores) data.stores = demoStores;
            if (!data.products) data.products = demoProducts;
            if (!data.pendingSales) data.pendingSales = demoPendingSales;
            if (!data.transactions) data.transactions = demoTransactions;
            return data;
          } catch {
            return { currentUser: null, users: demoUsers, stores: demoStores, products: demoProducts, transactions: demoTransactions, pendingSales: demoPendingSales, message: null };
          }
        }

        save() {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
        }

        login(username, password) {
          const user = this.state.users.find(u => u.username === username && u.pass === password);
          if (!user) {
            this.state.message = { type: "error", text: "Usuario o contraseña incorrectos." };
            return false;
          }
          this.state.currentUser = user;
          this.state.message = { type: "success", text: `¡Bienvenido, ${user.name}!` };
          this.buyerCart = [];
          this.save();
          return true;
        }

        logout() {
          this.state.currentUser = null;
          this.state.message = null;
          this.buyerCart = [];
          this.save();
        }

        registerBuyer(data) {
          const exists = this.state.users.find(u => u.username === data.username);
          if (exists) {
            this.state.message = { type: "error", text: "El nombre de usuario ya está registrado." };
            return;
          }
          const newUser = {
            id: "u" + (this.state.users.length + 1),
            username: data.username,
            pass: data.pass || "1234",
            name: data.name,
            role: "comprador",
            balance: 0,
            email: data.email,
            phone: data.phone
          };
          this.state.users.push(newUser);
          this.state.message = { type: "success", text: `Comprador ${data.name} registrado con éxito.` };
          this.save();
        }

        registerVendor(data) {
          const exists = this.state.users.find(u => u.username === data.username);
          if (exists) {
            this.state.message = { type: "error", text: "El nombre de usuario ya está registrado." };
            return;
          }
          const newVendor = {
            id: "u" + (this.state.users.length + 1),
            username: data.username,
            pass: data.pass || "1234",
            name: data.name,
            role: "vendedor",
            balance: 0,
            email: data.email,
            phone: data.phone
          };
          this.state.users.push(newVendor);
          this.state.message = { type: "success", text: `Vendedor ${data.name} registrado con éxito.` };
          this.save();
        }

        createStore(data) {
          const vendorAssigned = this.state.stores.find(s => s.vendorId === data.vendorId);
          if (vendorAssigned) {
            this.state.message = { type: "error", text: "Este vendedor ya tiene una tienda asignada (1 vendedor = 1 tienda)." };
            return;
          }
          const newStore = {
            id: "st" + (this.state.stores.length + 1),
            name: data.name,
            vendorId: data.vendorId
          };
          this.state.stores.push(newStore);
          this.state.message = { type: "success", text: `Tienda "${data.name}" creada y asignada con éxito.` };
          this.save();
        }

        addProduct(data) {
          const store = this.state.stores.find(s => s.id === data.storeId);
          if (!store) {
            this.state.message = { type: "error", text: "Seleccione una tienda válida." };
            return;
          }
          const newProduct = {
            id: "p" + (this.state.products.length + 1),
            code: data.code,
            name: data.name,
            price: Number(data.price),
            storeId: store.id
          };
          this.state.products.push(newProduct);
          this.state.message = { type: "success", text: `Producto [${data.code}] ${data.name} asignado a la tienda ${store.name} correctamente.` };
          this.save();
        }

        recharge(userId, amount, txNumber) {
          const user = this.state.users.find(u => u.id === userId);
          if (user) {
            const numAmount = Number(amount);
            user.balance += numAmount;
            if (this.state.currentUser && this.state.currentUser.id === userId) {
              this.state.currentUser.balance = user.balance;
            }
            this.state.transactions.unshift({
              tx: txNumber || `TX-${Math.floor(100000 + Math.random() * 900000)}`,
              type: "recarga",
              userName: user.name,
              amount: numAmount,
              date: new Date().toLocaleString()
            });
            this.state.message = { type: "success", text: `Recarga aplicada por $${numAmount.toLocaleString()} a ${user.name}.` };
            this.save();
          }
        }

        addToCartByCode(code) {
          const product = this.state.products.find(p => p.code.toLowerCase() === code.trim().toLowerCase());
          if (!product) {
            this.state.message = { type: "error", text: `Código de producto "${code}" no encontrado.` };
            return false;
          }
          const existingItem = this.buyerCart.find(item => item.product.id === product.id);
          if (existingItem) {
            existingItem.quantity += 1;
          } else {
            this.buyerCart.push({ product, quantity: 1 });
          }
          this.state.message = { type: "success", text: `Producto agregado: ${product.name}` };
          return true;
        }

        removeFromCart(productId) {
          this.buyerCart = this.buyerCart.filter(item => item.product.id !== productId);
          this.state.message = { type: "success", text: "Artículo eliminado de la lista." };
        }

        createPendingSale() {
          const buyer = this.state.currentUser;
          if (!buyer || buyer.role !== "comprador" || this.buyerCart.length === 0) return null;

          const totalAmount = this.buyerCart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);

          if (buyer.balance < totalAmount) {
            this.state.message = { type: "error", text: "Saldo insuficiente en la cuenta para realizar esta compra." };
            return null;
          }

          const firstProductStoreId = this.buyerCart[0].product.storeId;
          const store = this.state.stores.find(s => s.id === firstProductStoreId);
          const txCode = `PEND-${Math.floor(100000 + Math.random() * 900000)}`;

          const pendingSale = {
            tx: txCode,
            buyerId: buyer.id,
            buyerName: buyer.name,
            storeId: store ? store.id : null,
            storeName: store ? store.name : "Tienda",
            vendorId: store ? store.vendorId : null,
            items: JSON.parse(JSON.stringify(this.buyerCart)),
            totalAmount: totalAmount,
            date: new Date().toLocaleString()
          };

          this.state.pendingSales.unshift(pendingSale);
          this.buyerCart = [];
          this.state.message = { type: "success", text: `¡Compra iniciada! Número de transacción generado: ${txCode}` };
          this.save();
          return txCode;
        }

        approveSale(txCode) {
          const saleIdx = this.state.pendingSales.findIndex(s => s.tx === txCode);
          if (saleIdx === -1) return;

          const sale = this.state.pendingSales[saleIdx];
          const buyer = this.state.users.find(u => u.id === sale.buyerId);
          const vendorStore = this.state.stores.find(s => s.id === sale.storeId);
          const vendor = vendorStore ? this.state.users.find(u => u.id === vendorStore.vendorId) : null;

          if (!buyer || buyer.balance < sale.totalAmount) {
            this.state.message = { type: "error", text: "El comprador no tiene saldo suficiente para aprobar esta venta." };
            return;
          }

          buyer.balance -= sale.totalAmount;
          if (vendor) {
            vendor.balance += sale.totalAmount;
          }

          sale.items.forEach(item => {
            this.state.transactions.unshift({
              tx: sale.tx,
              type: "compra",
              userName: buyer.name,
              vendorName: vendor ? vendor.name : "Vendedor",
              storeName: sale.storeName,
              productName: `${item.product.name} (x${item.quantity})`,
              amount: item.product.price * item.quantity,
              date: new Date().toLocaleString()
            });
          });

          this.state.pendingSales.splice(saleIdx, 1);
          this.state.message = { type: "success", text: `¡Venta ${sale.tx} aprobada con éxito!` };
          this.save();
        }

        rejectSale(txCode) {
          this.state.pendingSales = this.state.pendingSales.filter(s => s.tx !== txCode);
          this.state.message = { type: "success", text: "Venta pendiente descartada." };
          this.save();
        }

        removeItemFromPendingSale(txCode, productId) {
          const sale = this.state.pendingSales.find(s => s.tx === txCode);
          if (!sale) return;

          sale.items = sale.items.filter(item => item.product.id !== productId);
          
          if (sale.items.length === 0) {
            this.rejectSale(txCode);
          } else {
            sale.totalAmount = sale.items.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
            this.state.message = { type: "success", text: "Artículo removido de la venta pendiente." };
            this.save();
          }
        }
      }

      const appInstance = new BazarApp();
      const root = document.getElementById("app");

      /* STREAMING_CHUNK:Global handler functions for HTML inline triggers... */
      window.handleCheckoutClick = function() {
        const confirmPurchase = window.confirm("¿Estás seguro de realizar esta compra?");
        if (confirmPurchase) {
          const txCode = appInstance.createPendingSale();
          if (txCode) {
            window.alert(`¡Compra iniciada con éxito!\n\nDale este número de transacción al vendedor en la tienda:\n\n${txCode}`);
            render();
          }
        }
      };

      window.handleApproveSale = function(txCode) {
        appInstance.approveSale(txCode);
        render();
      };

      window.handleRejectSale = function(txCode) {
        appInstance.rejectSale(txCode);
        render();
      };

      window.handleRemovePendingItem = function(txCode, prodId) {
        appInstance.removeItemFromPendingSale(txCode, prodId);
        render();
      };

      window.handleRemoveCartItem = function(prodId) {
        appInstance.removeFromCart(prodId);
        render();
      };

      window.handleQuickCode = function(code) {
        appInstance.addToCartByCode(code);
        render();
      };

      /* STREAMING_CHUNK:Rendering views and interface components... */
      function render() {
        const state = appInstance.state;
        if (!state.currentUser) {
          root.innerHTML = renderLoginView(state.message);
          bindLoginEvents();
        } else {
          root.innerHTML = renderDashboardView(state.currentUser, state.message);
          bindDashboardEvents();
        }
      }

      function renderLoginView(msg) {
        return `
          <div class="min-h-screen flex items-center justify-center p-4">
            <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
              <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-600 text-white rounded-2xl mx-auto flex items-center justify-center text-2xl font-black shadow-lg shadow-blue-500/30 mb-4">B</div>
                <h1 class="text-2xl font-extrabold text-slate-900">Bazar Escolar</h1>
                <p class="text-slate-500 text-sm mt-1">Inicia sesión con tu rol asignado</p>
              </div>

              ${msg ? `<div class="mb-4 p-3 rounded-xl text-sm font-semibold ${msg.type === 'error' ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-emerald-50 text-emerald-600 border border-emerald-100'}">${msg.text}</div>` : ''}

              <form id="loginForm" class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Usuario</label>
                  <input type="text" name="username" required placeholder="ej. ana.comprador" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-600/10 transition" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Contraseña</label>
                  <input type="password" name="password" required placeholder="••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-600/10 transition" />
                </div>
                <button type="submit" class="w-full py-3.5 bg-blue-600 text-white font-bold rounded-xl shadow-lg shadow-blue-600/30 hover:bg-blue-700 transition">Ingresar al Sistema</button>
              </form>

              <div class="mt-8 pt-6 border-t border-slate-100 text-xs text-slate-400 text-center">
                <p class="font-semibold mb-2">Cuentas de prueba:</p>
                <div class="flex flex-wrap gap-1 justify-center">
                  <span class="bg-slate-100 px-2 py-1 rounded text-slate-600">ana.comprador (1234)</span>
                  <span class="bg-slate-100 px-2 py-1 rounded text-slate-600">carlos.vendedor (1234)</span>
                  <span class="bg-slate-100 px-2 py-1 rounded text-slate-600">banco.escolar (1234)</span>
                  <span class="bg-slate-100 px-2 py-1 rounded text-slate-600">admin.general (1234)</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function renderDashboardView(user, msg) {
        let roleContent = "";

        if (user.role === "comprador") {
          const myPurchases = appInstance.state.transactions.filter(t => t.type === 'compra' && t.userName === user.name);
          const cart = appInstance.buyerCart;
          const cartTotal = cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);

          roleContent = `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
              <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-xl font-bold mb-4 text-blue-700">Identificar Producto (QR / Código)</h2>
                <p class="text-xs text-slate-500 mb-4">Ingresa el código del producto proporcionado por el vendedor.</p>
                
                <form id="scanForm" class="space-y-4">
                  <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Código de Producto</label>
                    <input type="text" id="productCodeInput" name="code" placeholder="ej. PROD-101" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-600 font-mono" />
                  </div>
                  <button type="submit" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl shadow hover:bg-blue-700 text-sm">Agregar a la Lista</button>
                </form>

                <div class="mt-6 pt-6 border-t border-slate-100">
                  <span class="text-xs font-bold text-slate-400 uppercase block mb-2">Códigos Disponibles (Prueba):</span>
                  <div class="flex flex-wrap gap-1">
                    ${appInstance.state.products.map(p => `
                      <button type="button" onclick="handleQuickCode('${p.code}')" class="px-2.5 py-1 bg-slate-100 hover:bg-blue-50 text-blue-600 text-xs font-bold rounded-lg border border-slate-200 cursor-pointer">
                        ${p.code} (${p.name})
                      </button>
                    `).join('')}
                  </div>
                </div>
              </div>

              <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                <div>
                  <h2 class="text-xl font-bold mb-4">Lista de Compra Actual</h2>
                  ${cart.length ? `
                    <div class="overflow-x-auto">
                      <table class="w-full text-left border-collapse">
                        <thead>
                          <tr class="border-b border-slate-100 text-xs uppercase text-slate-400">
                            <th class="py-2">Producto</th>
                            <th class="py-2">Código</th>
                            <th class="py-2">Cant.</th>
                            <th class="py-2">Precio Unit.</th>
                            <th class="py-2">Subtotal</th>
                            <th class="py-2 text-right">Acción</th>
                          </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 text-sm">
                          ${cart.map(item => `
                            <tr>
                              <td class="py-3 font-semibold text-slate-800">${item.product.name}</td>
                              <td class="py-3 text-xs text-slate-500 font-mono">${item.product.code}</td>
                              <td class="py-3">${item.quantity}</td>
                              <td class="py-3">$${item.product.price.toLocaleString()}</td>
                              <td class="py-3 font-bold text-blue-600">$${(item.product.price * item.quantity).toLocaleString()}</td>
                              <td class="py-3 text-right">
                                <button type="button" onclick="handleRemoveCartItem('${item.product.id}')" class="px-2.5 py-1 bg-red-50 text-red-600 text-xs font-bold rounded-lg hover:bg-red-100 cursor-pointer">Quitar</button>
                              </td>
                            </tr>
                          `).join('')}
                        </tbody>
                      </table>
                    </div>
                  ` : `
                    <div class="text-center py-12 text-slate-400">
                      <p class="text-sm">No has agregado ningún producto todavía.</p>
                      <p class="text-xs mt-1">Usa el formulario de códigos para armar tu compra.</p>
                    </div>
                  `}
                </div>

                ${cart.length ? `
                  <div class="mt-6 pt-4 border-t border-slate-100 flex justify-between items-center">
                    <div>
                      <span class="text-xs text-slate-400 uppercase block font-bold">Valor Total a Pagar</span>
                      <span class="text-3xl font-black text-slate-900">$${cartTotal.toLocaleString()}</span>
                    </div>
                    <button type="button" onclick="handleCheckoutClick()" class="px-6 py-3.5 bg-emerald-600 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/20 hover:bg-emerald-700 transition cursor-pointer">Pagar Compra</button>
                  </div>
                ` : ''}
              </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
              <h2 class="text-xl font-bold mb-4">Mis Compras Realizadas</h2>
              ${myPurchases.length ? `
                <div class="space-y-3">
                  ${myPurchases.map(t => `
                    <div class="p-3 bg-slate-50 rounded-xl text-sm border border-slate-100 flex justify-between items-center">
                      <div>
                        <div class="font-bold text-slate-800">${t.productName}</div>
                        <div class="text-xs text-slate-500">Tienda: ${t.storeName} (${t.vendorName}) - Transacción: ${t.tx}</div>
                      </div>
                      <div class="text-right">
                        <span class="font-bold text-blue-600 block">$${t.amount.toLocaleString()}</span>
                        <span class="text-[10px] text-slate-400">${t.date}</span>
                      </div>
                    </div>
                  `).join('')}
                </div>
              ` : `<p class="text-sm text-slate-400">Aún no tienes compras aprobadas.</p>`}
            </div>
          `;
        } else if (user.role === "vendedor") {
          const myStore = appInstance.state.stores.find(s => s.vendorId === user.id);
          const myProducts = myStore ? appInstance.state.products.filter(p => p.storeId === myStore.id) : [];
          const pendingSales = myStore ? appInstance.state.pendingSales.filter(s => s.storeId === myStore.id) : [];
          const mySales = myStore ? appInstance.state.transactions.filter(t => t.type === 'compra' && t.storeName === myStore.name) : [];
          const totalSalesAmount = mySales.reduce((acc, t) => acc + t.amount, 0);

          roleContent = `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
              <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <span class="text-xs font-bold text-slate-400 uppercase">Mi Tienda Asignada</span>
                <h3 class="text-2xl font-black text-slate-900 mt-1">${myStore ? myStore.name : 'Sin tienda asignada'}</h3>
                <span class="text-xs text-slate-400 block mt-4">Ventas Totales</span>
                <h4 class="text-3xl font-black text-emerald-600 mt-1">$${totalSalesAmount.toLocaleString()}</h4>
                <p class="text-xs text-slate-500 mt-1">${mySales.length} transacciones completadas</p>
              </div>
              <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-xl font-bold mb-4">Productos en mi Tienda (Catálogo QR / Códigos)</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  ${myProducts.length ? myProducts.map(p => `
                    <div class="p-4 rounded-xl border border-slate-100 bg-slate-50 flex justify-between items-center">
                      <div>
                        <span class="text-xs font-bold text-blue-600 font-mono">${p.code}</span>
                        <h3 class="font-bold text-slate-800">${p.name}</h3>
                        <p class="text-sm text-slate-500">Precio: $${p.price.toLocaleString()}</p>
                      </div>
                      <div class="w-12 h-12 bg-white border border-slate-200 rounded-lg flex items-center justify-center text-[10px] font-bold text-slate-400 text-center p-1">
                        [QR]
                      </div>
                    </div>
                  `).join('') : `<p class="text-sm text-slate-400">El administrador aún no ha asociado productos a tu tienda.</p>`}
                </div>
              </div>
            </div>

            <div class="bg-amber-50 border border-amber-200 p-6 rounded-2xl shadow-sm mb-6">
              <h2 class="text-xl font-bold mb-4 text-amber-900">🔔 Ventas Nuevas Pendientes por Aprobar</h2>
              ${pendingSales.length ? `
                <div class="space-y-4">
                  ${pendingSales.map(sale => `
                    <div class="bg-white p-5 rounded-xl border border-amber-300 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                      <div>
                        <div class="flex items-center gap-2 mb-1">
                          <span class="bg-amber-100 text-amber-800 font-mono px-2 py-0.5 rounded text-xs font-bold">${sale.tx}</span>
                          <span class="text-sm font-bold text-slate-800">Comprador: ${sale.buyerName}</span>
                        </div>
                        <div class="text-xs text-slate-500 mb-2">Fecha: ${sale.date}</div>
                        
                        <div class="space-y-2">
                          ${sale.items.map(item => `
                            <div class="text-xs text-slate-700 flex items-center justify-between gap-4 bg-slate-50 p-2 rounded-lg">
                              <span>• <strong>${item.product.name}</strong> (x${item.quantity}) - $${(item.product.price * item.quantity).toLocaleString()}</span>
                              <button type="button" onclick="handleRemovePendingItem('${sale.tx}', '${item.product.id}')" class="text-red-600 hover:text-red-800 font-bold px-2 py-1 bg-white border border-red-100 rounded text-[10px] cursor-pointer">Quitar Producto</button>
                            </div>
                          `).join('')}
                        </div>
                        <div class="mt-3 text-sm font-black text-blue-600">Total: $${sale.totalAmount.toLocaleString()}</div>
                      </div>
                      
                      <div class="flex items-center gap-2 w-full md:w-auto">
                        <button type="button" onclick="handleRejectSale('${sale.tx}')" class="flex-1 md:flex-initial px-4 py-2.5 bg-red-50 text-red-600 text-xs font-bold rounded-xl hover:bg-red-100 border border-red-200 cursor-pointer">Rechazar / Quitar</button>
                        <button type="button" onclick="handleApproveSale('${sale.tx}')" class="flex-1 md:flex-initial px-6 py-2.5 bg-emerald-600 text-white text-xs font-bold rounded-xl shadow hover:bg-emerald-700 cursor-pointer">Aprobar Venta</button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              ` : `<p class="text-sm text-slate-500">No hay ventas pendientes de aprobación en este momento.</p>`}
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
              <h2 class="text-xl font-bold mb-4">Historial de Ventas Aprobadas</h2>
              ${mySales.length ? `
                <div class="space-y-2">
                  ${mySales.map(t => `
                    <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl text-sm border border-slate-100">
                      <div>
                        <strong class="text-blue-600">${t.productName}</strong> - Comprador: <span class="font-semibold">${t.userName}</span>
                        <span class="text-xs text-slate-400 block">${t.date}</span>
                      </div>
                      <span class="font-black text-emerald-600">+$${t.amount.toLocaleString()}</span>
                    </div>
                  `).join('')}
                </div>
              ` : `<p class="text-sm text-slate-400">No hay ventas completadas todavía.</p>`}
            </div>
          `;
        } else if (user.role === "banco") {
          const buyers = appInstance.state.users.filter(u => u.role === 'comprador');
          roleContent = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
              <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-xl font-bold mb-4 text-emerald-700">Módulo de Recargas de Saldo</h2>
                <form id="rechargeForm" class="space-y-4">
                  <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Seleccionar Comprador</label>
                    <select name="userId" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm">
                      ${buyers.map(u => `<option value="${u.id}">${u.name} (Saldo: $${u.balance.toLocaleString()})</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Método de Transacción</label>
                    <select id="paymentMethodSelect" name="paymentMethod" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm">
                      <option value="electronica">Electrónica</option>
                      <option value="efectivo">Efectivo</option>
                    </select>
                  </div>
                  <div id="txNumberContainer">
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Número de Transacción Electrónica</label>
                    <input type="text" id="txNumberInput" name="txNumber" placeholder="ej. TX-948210" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Monto a recargar ($)</label>
                    <input type="number" name="amount" value="20000" step="500" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm" />
                  </div>
                  <button type="submit" class="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow hover:bg-emerald-700 text-sm cursor-pointer">Aplicar Recarga</button>
                </form>
              </div>

              <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-xl font-bold mb-4 text-blue-700">Registrar Nuevo Comprador</h2>
                <form id="registerBuyerForm" class="space-y-3">
                  <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Usuario (Login)</label>
                    <input type="text" name="username" placeholder="ej. sofia.est" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Contraseña Inicial</label>
                    <input type="text" name="pass" placeholder="ej. 1234" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nombre Completo</label>
                    <input type="text" name="name" placeholder="ej. Sofia Estudiante" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Correo Electrónico</label>
                    <input type="email" name="email" placeholder="correo@escuela.edu" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Teléfono de Contacto</label>
                    <input type="tel" name="phone" placeholder="ej. 3001234567" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm" />
                  </div>
                  <button type="submit" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl shadow hover:bg-blue-700 text-sm cursor-pointer">Registrar Comprador</button>
                </form>
              </div>
            </div>
          `;
        } else if (user.role === "administrador") {
          const vendors = appInstance.state.users.filter(u => u.role === 'vendedor');
          const stores = appInstance.state.stores;
          const sales = appInstance.state.transactions.filter(t => t.type === 'compra');
          const totalSales = sales.reduce((acc, t) => acc + t.amount, 0);

          const productCounts = {};
          sales.forEach(s => {
            const pBaseName = s.productName.split(' (x')[0];
            productCounts[pBaseName] = (productCounts[pBaseName] || 0) + 1;
          });
          const topProducts = Object.entries(productCounts).sort((a,b) => b[1] - a[1]);

          const storeTotals = {};
          stores.forEach(st => {
            storeTotals[st.name] = sales.filter(s => s.storeName === st.name).reduce((acc, s) => acc + s.amount, 0);
          });

          roleContent = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
              <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <span class="text-xs font-bold text-slate-400 uppercase">Ventas Totales del Bazar</span>
                <h3 class="text-3xl font-black text-blue-600 mt-2">$${totalSales.toLocaleString()}</h3>
                <p class="text-xs text-slate-500 mt-1">${sales.length} transacciones completadas</p>
                
                <h4 class="font-bold text-sm text-slate-700 mt-6 mb-3">Ventas Totales por Tienda / Vendedor</h4>
                <div class="space-y-2">
                  ${Object.entries(storeTotals).map(([stName, amount]) => `
                    <div class="flex justify-between items-center p-2.5 bg-slate-50 rounded-xl text-sm">
                      <span class="font-medium">${stName}</span>
                      <strong class="text-emerald-600">$${amount.toLocaleString()}</strong>
                    </div>
                  `).join('')}
                </div>
              </div>

              <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-xl font-bold mb-4">Top de Productos Más Vendidos</h2>
                ${topProducts.length ? `
                  <div class="space-y-3">
                    ${topProducts.map(([pName, count], idx) => `
                      <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl text-sm border border-slate-100">
                        <div class="flex items-center gap-3">
                          <span class="w-6 h-6 rounded-full bg-blue-100 text-blue-700 font-bold flex items-center justify-center text-xs">#${idx+1}</span>
                          <span class="font-bold text-slate-800">${pName}</span>
                        </div>
                        <span class="font-bold text-slate-600">${count} ventas</span>
                      </div>
                    `).join('')}
                  </div>
                ` : `<p class="text-sm text-slate-400">Aún no hay suficientes ventas para calcular el top.</p>`}
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
              <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-xl font-bold mb-4 text-purple-700">Registrar Nuevo Vendedor</h2>
                <form id="registerVendorForm" class="space-y-3">
                  <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Usuario (Login)</label>
                    <input type="text" name="username" placeholder="ej. pedro.vendedor" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Contraseña Inicial</label>
                    <input type="text" name="pass" placeholder="ej. 1234" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nombre Completo</label>
                    <input type="text" name="name" placeholder="ej. Pedro Vendedor" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Correo Electrónico</label>
                    <input type="email" name="email" placeholder="correo@escuela.edu" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Teléfono de Contacto</label>
                    <input type="tel" name="phone" placeholder="ej. 3001234567" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm" />
                  </div>
                  <button type="submit" class="w-full py-3 bg-purple-600 text-white font-bold rounded-xl shadow hover:bg-purple-700 text-sm cursor-pointer">Registrar Vendedor</button>
                </form>
              </div>

              <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-xl font-bold mb-4 text-cyan-700">Crear Tienda y Asignar Vendedor (1 a 1)</h2>
                <form id="createStoreForm" class="space-y-3">
                  <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nombre de la Tienda</label>
                    <input type="text" name="name" placeholder="ej. Postres San José" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Seleccionar Vendedor</label>
                    <select name="vendorId" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm">
                      ${vendors.map(v => `<option value="${v.id}">${v.name}</option>`).join('')}
                    </select>
                  </div>
                  <p class="text-xs text-slate-400 mt-2">Nota: Cada vendedor tiene exclusivamente una tienda asignada.</p>
                  <button type="submit" class="w-full py-3 bg-cyan-600 text-white font-bold rounded-xl shadow hover:bg-cyan-700 text-sm mt-4 cursor-pointer">Crear y Asignar Tienda</button>
                </form>
              </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
              <h2 class="text-xl font-bold mb-4 text-amber-700">Asignar Producto a Tienda (Con Código QR / Barras)</h2>
              <form id="addProductForm" class="grid grid-cols-1 sm:grid-cols-4 gap-4 items-end">
                <div>
                  <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Seleccionar Tienda</label>
                  <select name="storeId" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm">
                    ${stores.map(st => `<option value="${st.id}">${st.name}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Código del Producto (QR)</label>
                  <input type="text" name="code" placeholder="ej. PROD-103" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm font-mono" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nombre del Producto</label>
                  <input type="text" name="name" placeholder="ej. Brownie de Chocolate" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Precio de Venta ($)</label>
                  <input type="number" name="price" placeholder="ej. 5000" step="500" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm" />
                </div>
                <div class="sm:col-span-4">
                  <button type="submit" class="w-full py-2.5 bg-amber-600 text-white font-bold rounded-xl shadow hover:bg-amber-700 text-sm cursor-pointer">Asignar Producto</button>
                </div>
              </form>
            </div>
          `;
        }

        return `
          <div class="min-h-screen">
            <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center font-black">B</div>
                <div>
                  <h2 class="font-bold text-slate-900">Bazar Escolar</h2>
                  <span class="text-xs text-slate-500 capitalize">Rol: ${user.role}</span>
                </div>
              </div>
              <div class="flex items-center gap-4">
                ${user.role === 'comprador' ? `
                  <div class="text-right">
                    <span class="block text-xs text-slate-400 font-bold uppercase">Saldo Disponible</span>
                    <strong class="text-blue-600 font-black text-lg">$${user.balance.toLocaleString()}</strong>
                  </div>
                ` : ''}
                <button type="button" id="logoutBtn" class="px-4 py-2 bg-red-50 text-red-600 font-bold text-sm rounded-xl hover:bg-red-100 transition cursor-pointer">Cerrar Sesión</button>
              </div>
            </header>

            <main class="max-w-6xl mx-auto p-6">
              ${msg ? `<div class="mb-6 p-4 rounded-xl text-sm font-semibold ${msg.type === 'error' ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-emerald-50 text-emerald-600 border border-emerald-100'}">${msg.text}</div>` : ''}
              ${roleContent}
            </main>
          </div>
        `;
      }

      function bindLoginEvents() {
        const form = document.getElementById("loginForm");
        if (form) {
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            const data = new FormData(form);
            appInstance.login(data.get("username"), data.get("password"));
            render();
          });
        }
      }

      function bindDashboardEvents() {
        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
          logoutBtn.addEventListener("click", () => {
            appInstance.logout();
            render();
          });
        }

        const scanForm = document.getElementById("scanForm");
        if (scanForm) {
          scanForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const codeInput = document.getElementById("productCodeInput");
            if (codeInput && codeInput.value) {
              appInstance.addToCartByCode(codeInput.value);
              render();
            }
          });
        }

        const paymentMethodSelect = document.getElementById("paymentMethodSelect");
        const txNumberContainer = document.getElementById("txNumberContainer");
        const txNumberInput = document.getElementById("txNumberInput");

        if (paymentMethodSelect) {
          paymentMethodSelect.addEventListener("change", (e) => {
            if (e.target.value === "efectivo") {
              const consecutivo = `EFECTIVO-${Math.floor(100000 + Math.random() * 900000)}`;
              txNumberInput.value = consecutivo;
              txNumberInput.readOnly = true;
              txNumberContainer.querySelector("label").textContent = "Número Consecutivo de Efectivo";
            } else {
              txNumberInput.value = "";
              txNumberInput.readOnly = false;
              txNumberContainer.querySelector("label").textContent = "Número de Transacción Electrónica";
            }
          });
        }

        const rechargeForm = document.getElementById("rechargeForm");
        if (rechargeForm) {
          rechargeForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const data = new FormData(rechargeForm);
            let txNum = data.get("txNumber");
            if (data.get("paymentMethod") === "efectivo" && !txNum) {
              txNum = `EFECTIVO-${Math.floor(100000 + Math.random() * 900000)}`;
            }
            appInstance.recharge(data.get("userId"), data.get("amount"), txNum);
            render();
          });
        }

        const registerBuyerForm = document.getElementById("registerBuyerForm");
        if (registerBuyerForm) {
          registerBuyerForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const data = new FormData(registerBuyerForm);
            appInstance.registerBuyer({
              username: data.get("username"),
              pass: data.get("pass"),
              name: data.get("name"),
              email: data.get("email"),
              phone: data.get("phone")
            });
            render();
          });
        }

        const registerVendorForm = document.getElementById("registerVendorForm");
        if (registerVendorForm) {
          registerVendorForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const data = new FormData(registerVendorForm);
            appInstance.registerVendor({
              username: data.get("username"),
              pass: data.get("pass"),
              name: data.get("name"),
              email: data.get("email"),
              phone: data.get("phone")
            });
            render();
          });
        }

        const createStoreForm = document.getElementById("createStoreForm");
        if (createStoreForm) {
          createStoreForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const data = new FormData(createStoreForm);
            appInstance.createStore({
              name: data.get("name"),
              vendorId: data.get("vendorId")
            });
            render();
          });
        }

        const addProductForm = document.getElementById("addProductForm");
        if (addProductForm) {
          addProductForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const data = new FormData(addProductForm);
            appInstance.addProduct({
              storeId: data.get("storeId"),
              code: data.get("code"),
              name: data.get("name"),
              price: data.get("price")
            });
            render();
          });
        }
      }

      render();
    </script>
  </body>
</html>
